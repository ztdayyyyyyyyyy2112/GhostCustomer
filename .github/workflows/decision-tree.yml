name: Decision Tree benchmark

on:
  pull_request:
    branches: [develop]
    paths:
      - "research/baselines/**"
      - ".github/workflows/decision-tree.yml"
  push:
    branches: [develop]
    paths:
      - "research/baselines/**"
      - ".github/workflows/decision-tree.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/baselines/requirements-decision-tree.txt
      - run: python -m pip install -r research/baselines/requirements-decision-tree.txt
      - run: python -m pytest research/baselines/tests -q
